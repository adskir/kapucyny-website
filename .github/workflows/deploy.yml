# Збірка сайта (Eleventy) і загрузка на хостынг hoster.by па FTPS.
# Запускаецца пры кожным push у main, а таксама ўручную (Actions → Run workflow).
name: Deploy to hoster.by

on:
  push:
    branches: [main]
  # Начная страхоўка: калі ўдзень выкладка не прайшла, сайт уначы сам «дагоніць» усе праўкі з GitHub.
  # 02:17 UTC = 05:17 па Мінску.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      attempt:
        description: "Нумар спробы (ставіцца аўтаматычна пры перазапуску)"
        required: false
        default: "1"

permissions:
  contents: read
  actions: write   # каб перазапусціць сябе на новай машыне, калі хостынг не пусціў
  issues: write    # каб паведаміць адміністратару, калі не атрымалася зусім

concurrency:
  group: deploy-hoster
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Кэш аптымізаваных выяў, каб не пералічваць іх пры кожнай зборцы
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-img-${{ github.run_id }}
          restore-keys: eleventy-img-

      - run: npm install --no-audit --no-fund

      - run: npx @11ty/eleventy

      # Заліваем у корань сайта (/www/kapucyny.by — хатняя папка FTP-карыстальніка).
      # Акцыя толькі дадае/абнаўляе файлы і НЕ выдаляе чужыя (напр. .well-known для SSL).
      # Хостынг часам не адказвае на першае падключэнне (ETIMEDOUT) — тады чакаем хвіліну і спрабуем яшчэ раз
      - name: Upload (спроба 1)
        id: upload1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./

      - name: Пауза перад паўторнай спробай
        if: steps.upload1.outcome == 'failure'
        run: sleep 60

      - name: Upload (спроба 2)
        id: upload2
        if: steps.upload1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./

      # hoster.by часам блакуе FTP з канкрэтнага IP машыны GitHub — паўтор з той жа машыны не дапамагае.
      # Тады запускаем дэплой нанова (новая машына = новы IP), да 3 разоў. Ніякіх лістоў пра памылку.
      # Калі не атрымалася і з трэцяй машыны — ствараем Issue з пазнакай адміністратара (ліст прыходзіць яму,
      # а не браце, які захаваў праўку ў адмінцы). Праўкі пры гэтым не губляюцца: яны ўжо ў GitHub
      # і трапяць на сайт пры наступнай удалай выкладцы (у тым ліку начной).
      - name: Перазапуск на новай машыне / паведамленне адміністратару
        if: steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ATTEMPT" -lt 3 ]; then
            next=$((ATTEMPT + 1))
            echo "Хостынг не пусціў гэтую машыну. Запускаю спробу $next на новай машыне."
            gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main -f attempt=$next
            exit 0
          fi
          title="Сайт не выкладзены: hoster.by не пускае FTP"
          body="Тры розныя машыны GitHub запар не змаглі падключыцца па FTP да hoster.by.
          Праўкі захаваны ў GitHub і з'явяцца на сайце пры наступнай удалай выкладцы (у тым ліку начной у 05:17).
          Калі паўтараецца — праверыць хостынг / FTP-карыстальніка h118307_github.

          Запуск: $RUN_URL
          @${{ github.repository_owner }}"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "Зноў не атрымалася: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          echo "::warning::Выкладка не прайшла з трох машын — створана паведамленне (Issue)."

      # Калі выкладка ўрэшце прайшла — закрываем адкрытае паведамленне пра збой (калі было)
      - name: Закрыць паведамленне пра збой
        if: steps.upload1.outcome == 'success' || steps.upload2.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Сайт не выкладзены"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Выкладка прайшла, сайт абноўлены."; fi
