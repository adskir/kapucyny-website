# Збірка сайта (Eleventy) і загрузка на хостынг hoster.by па FTPS.
# Запускаецца пры кожным push у main, а таксама ўручную (Actions → Run workflow).
name: Deploy to hoster.by

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      attempt:
        description: "Нумар спробы (ставіцца аўтаматычна пры перазапуску)"
        required: false
        default: "1"

permissions:
  contents: read
  actions: write   # каб перазапусціць сябе на новай машыне, калі хостынг не пусціў

concurrency:
  group: deploy-hoster
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Кэш аптымізаваных выяў, каб не пералічваць іх пры кожнай зборцы
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-img-${{ github.run_id }}
          restore-keys: eleventy-img-

      - run: npm install --no-audit --no-fund

      - run: npx @11ty/eleventy

      # Заліваем у корань сайта (/www/kapucyny.by — хатняя папка FTP-карыстальніка).
      # Акцыя толькі дадае/абнаўляе файлы і НЕ выдаляе чужыя (напр. .well-known для SSL).
      # Хостынг часам не адказвае на першае падключэнне (ETIMEDOUT) — тады чакаем хвіліну і спрабуем яшчэ раз
      - name: Upload (спроба 1)
        id: upload1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./

      - name: Пауза перад паўторнай спробай
        if: steps.upload1.outcome == 'failure'
        run: sleep 60

      - name: Upload (спроба 2)
        id: upload2
        if: steps.upload1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./

      # hoster.by часам блакуе FTP з канкрэтнага IP машыны GitHub — паўтор з той жа машыны не дапамагае.
      # Тады запускаем дэплой нанова (новая машына = новы IP), да 3 разоў, без ліста пра памылку.
      # Ліст прыйдзе, толькі калі не атрымалася і з трэцяй машыны.
      - name: Перазапуск на новай машыне
        if: steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          if [ "$ATTEMPT" -lt 3 ]; then
            next=$((ATTEMPT + 1))
            echo "Хостынг не пусціў гэтую машыну. Запускаю спробу $next на новай машыне."
            gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main -f attempt=$next
          else
            echo "::error::Хостынг hoster.by не пусціў па FTP тры розныя машыны запар. Трэба праверыць хостынг."
            exit 1
          fi
