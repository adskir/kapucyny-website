# Праверка сайта і рэдырэктаў са старых адрасоў (запуск уручную: Actions → Check site → Run workflow)
name: Check site

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Галоўная і асноўныя старонкі
        run: |
          for u in / /minsk/ /naviny/ /kantakty/ /sitemap.xml /robots.txt /404-test-neisnuje/; do
            printf "%-28s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' "https://kapucyny.by$u")"
          done
          echo; echo "Загаловак галоўнай:"; curl -s https://kapucyny.by/ | grep -o '<title>[^<]*' | head -1

      - name: Рэдырэкты (стары адрас → новы)
        run: |
          check() {
            r=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$1")
            printf "%-50s %s\n" "$1" "$r"
          }
          check "http://kapucyny.by/"
          check "https://www.kapucyny.by/"
          check "https://kapucyny.by/?page_id=405"
          check "https://kapucyny.by/index.php/?page_id=405"
          check "https://kapucyny.by/?page_id=1692"
          check "https://kapucyny.by/?page_id=15"
          check "https://kapucyny.by/?page_id=317"
          check "https://kapucyny.by/?page_id=2329"
          check "https://kapucyny.by/?p=5164"
          check "https://kapucyny.by/?p=4061"
          check "https://kapucyny.by/?cat=4"
          check "https://kapucyny.by/?topic=test"
          check "https://kapucyny.by/?page_id=9999"
          check "https://kapucyny.by/wp-login.php"
          check "https://kapucyny.by/index.php"
          check "https://kapucyny.by/molodechno.html"
          check "https://kapucyny.by/linki.html"
          check "https://kapucyny.by/index1.html"
          check "https://kapucyny.by/kapucyny_kapucynyby.sql.gz"
          check "https://kapucyny.by/wp-content/uploads/"

      - name: Поўны ланцужок для старога http-адраса
        run: |
          curl -sIL --max-redirs 5 "http://kapucyny.by/?page_id=405" | grep -iE "^(HTTP|location)"
          echo; curl -sIL --max-redirs 5 "http://kapucyny.by/minsk/" | grep -iE "^(HTTP|location|server)"

      - name: Змест і прэв'ю для сацсетак / WhatsApp
        run: |
          echo "Маладзечна:"
          p=$(curl -s https://kapucyny.by/maladzyechna/)
          echo "$p" | grep -o '<dt>[^<]*сайт</dt>' | head -2
          echo "$p" | grep -o 'href="https://sacris.by/"' | sort | uniq -c
          echo; echo "Open Graph галоўнай:"
          curl -s https://kapucyny.by/ | grep -oE '<meta (property|name)="(og|twitter):[^"]*" content="[^"]*"'
          echo; echo "Выява прэв'ю:"
          curl -sI https://kapucyny.by/images/og-default.jpg | grep -iE "^(HTTP|content-type|content-length)"
